services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: studytrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - studytrack_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studytrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  studytrack_pgdata:
